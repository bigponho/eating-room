<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>一起吃三餐・3D 立體雲端圓桌包廂</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #FFF9F2;
      --card: #FFFFFF;
      --primary: #FF7849;
      --primary-dark: #E85A2A;
      --secondary: #FFF0E5;
      --text: #3E2723;
      --muted: #8D6E63;
      --line: #06C755;
      --border: #F3E5D8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .hidden { display: none !important; }
    .btn {
      border: none; border-radius: 14px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: transform 0.1s, opacity 0.15s; font-size: 14px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #FF8E53, #FF6B35);
      color: #fff; box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
    }
    .btn-line {
      background: var(--line); color: #fff;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.25);
    }
    .btn-outline {
      background: #fff; color: var(--text); border: 1.5px solid var(--border);
    }

    /* ================= 1. 入口大廳 ================= */
    #entry-screen {
      width: 100%;
      min-height: 100dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(12px + var(--safe-top)) 14px calc(80px + var(--safe-bottom));
      display: flex; flex-direction: column; align-items: center;
    }
    .entry-card {
      width: 100%; max-width: 440px;
      background: var(--card); border-radius: 24px;
      box-shadow: 0 10px 30px rgba(62, 39, 35, 0.08);
      border: 1px solid var(--border);
    }
    .hero-banner {
      background: linear-gradient(135deg, #FF8A5B 0%, #FF6B35 100%);
      color: #fff; padding: 18px 14px; text-align: center;
      border-radius: 23px 23px 0 0;
    }
    .hero-emojis { font-size: 26px; margin-bottom: 2px; letter-spacing: 4px; }
    .hero-title { font-size: 21px; font-weight: 800; margin: 0; }
    .hero-sub { font-size: 11.5px; opacity: 0.94; margin-top: 4px; }

    .entry-body { padding: 14px; }

    .tabs {
      display: grid; grid-template-columns: 1fr 1fr;
      background: #F8EFE6; padding: 4px; border-radius: 14px; margin-bottom: 14px;
    }
    .tab-btn {
      padding: 9px 6px; border: none; border-radius: 11px;
      font-size: 13px; font-weight: 700; color: var(--muted);
      background: transparent; cursor: pointer;
    }
    .tab-btn.active {
      background: #fff; color: var(--primary-dark);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; font-weight: 700; margin-bottom: 8px; gap: 6px;
    }
    .section-hint { font-size: 11px; color: var(--muted); font-weight: 400; }

    .pin-box-wrap {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      margin-bottom: 14px;
    }
    .pin-input {
      width: 100%; height: 48px; text-align: center; font-size: 22px; font-weight: 800;
      border: 2px solid var(--border); border-radius: 14px; background: #FFFDFB;
      color: var(--text); outline: none;
    }
    .pin-input:focus { border-color: var(--primary); background: #fff; }

    .meal-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px;
    }
    .meal-btn {
      padding: 7px 4px; border-radius: 11px; border: 1.5px solid var(--border);
      background: #fff; font-size: 12px; font-weight: 700; color: var(--text); cursor: pointer;
    }
    .meal-btn.active {
      border-color: var(--primary); background: var(--secondary); color: var(--primary-dark);
    }

    .invite-box {
      background: #F9F5F0; border: 1px dashed #D7CCC8; border-radius: 12px;
      padding: 9px; font-size: 11.5px; color: var(--text); white-space: pre-wrap;
      word-break: break-all; margin-bottom: 10px; line-height: 1.4;
    }

    .profile-card {
      background: #FFFBF7; border: 1.5px solid var(--border);
      border-radius: 16px; padding: 11px; margin-bottom: 14px;
      display: flex; gap: 10px; align-items: center;
    }
    .avatar-preview-wrap {
      position: relative; width: 76px; height: 84px; flex-shrink: 0;
      background: radial-gradient(circle at 50% 30%, #FFF, #FDE8D7);
      border-radius: 16px; border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .dice-btn {
      position: absolute; bottom: -5px; right: -5px;
      width: 26px; height: 26px; border-radius: 50%;
      background: #fff; border: 1.5px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .profile-fields { flex: 1; min-width: 0; }
    .text-input {
      width: 100%; padding: 8px 10px; border-radius: 10px;
      border: 1.5px solid var(--border); font-size: 14px; font-weight: 600;
      outline: none; margin-bottom: 7px; background: #fff;
    }
    .text-input:focus { border-color: var(--primary); }

    .gender-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .gender-btn {
      padding: 6px 2px; border-radius: 9px; border: 1.5px solid var(--border);
      background: #fff; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--muted);
    }
    .gender-btn.active {
      border-color: var(--primary); background: var(--secondary); color: var(--primary-dark);
    }

    .line-autofill-btn {
      background: #E8F8EE; color: #059640; border: 1px solid #B7EBC9;
      border-radius: 20px; padding: 4px 9px; font-size: 11px; font-weight: 700;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
